app-id: io.github.ksmcamurcu.Wox
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: wox

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --device=kvm
  - --filesystem=xdg-data/wox:create
  - --env=PYTHONUNBUFFERED=1

modules:
  - name: wox
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - python3 -m pip install --prefix=/app --no-cache-dir .
      - install -Dm755 run_wox.py /app/bin/wox
      - install -Dm644 packaging/io.github.ksmcamurcu.Wox.metainfo.xml /app/share/metainfo/io.github.ksmcamurcu.Wox.metainfo.xml
      - install -Dm644 packaging/wox.svg /app/share/icons/hicolor/scalable/apps/io.github.ksmcamurcu.Wox.svg
      - install -Dm755 /dev/null /app/share/applications/io.github.ksmcamurcu.Wox.desktop
      - |
        cat > /app/share/applications/io.github.ksmcamurcu.Wox.desktop <<'EOF'
        [Desktop Entry]
        Name=Wox
        Comment=Wox sanal makine motoru prototipi
        Exec=wox
        Icon=io.github.ksmcamurcu.Wox
        Terminal=false
        Type=Application
        Categories=System;Emulator;
        EOF
    sources:
      - type: dir
        path: ..
