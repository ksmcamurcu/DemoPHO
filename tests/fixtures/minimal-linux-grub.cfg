set timeout=1
set default=0

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial

menuentry "Wox Linux boot smoke test" {
    linux /boot/vmlinuz console=ttyS0,115200n8 earlycon=uart,io,0x3f8,115200 rdinit=/init quiet loglevel=0
    initrd /boot/initramfs.cpio.gz
}
