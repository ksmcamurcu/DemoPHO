name: Paketleri oluştur

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[build]"
      - run: pyinstaller --noconfirm --clean --onefile --name DemoPHO-API --collect-all fastapi --collect-all starlette --collect-all pydantic --collect-all uvicorn run_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: DemoPHO-Windows-exe
          path: dist/DemoPHO-API.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[build]"
      - run: pyinstaller --noconfirm --clean --onefile --name demopho-api --collect-all fastapi --collect-all starlette --collect-all pydantic --collect-all uvicorn run_api.py
      - name: AppDir yapısını hazırla
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp dist/demopho-api AppDir/usr/bin/demopho-api
          cp packaging/demopho-api.desktop AppDir/demopho-api.desktop
          cp packaging/demopho-api.desktop AppDir/usr/share/applications/demopho-api.desktop
          cp packaging/demopho-api.svg AppDir/usr/share/icons/hicolor/scalable/apps/demopho-api.svg
          cp packaging/demopho-api.svg AppDir/demopho-api.svg
          cp packaging/demopho-api.svg AppDir/.DirIcon
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/demopho-api" "$@"
          EOF
          chmod +x AppDir/AppRun
      - name: AppImage oluştur
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          curl -L --fail --retry 3 -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage AppDir dist/DemoPHO-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: DemoPHO-Linux-AppImage
          path: dist/DemoPHO-x86_64.AppImage
