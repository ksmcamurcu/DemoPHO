name: Wox paketlerini oluştur

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install ".[test]"
      - run: .venv/bin/python -m pytest -q

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python -m pip install ".[build]"
      - run: .\.venv\Scripts\python -m PyInstaller --noconfirm --clean --onefile --windowed --name Wox --collect-all fastapi --collect-all starlette --collect-all pydantic --collect-all uvicorn run_wox.py
      - uses: actions/upload-artifact@v4
        with:
          name: Wox-Windows-exe
          path: dist/Wox.exe

  linux:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install ".[build]"
      - run: .venv/bin/python -m PyInstaller --noconfirm --clean --onefile --windowed --name Wox --collect-all fastapi --collect-all starlette --collect-all pydantic --collect-all uvicorn run_wox.py
      - name: AppDir yapısını hazırla
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/doc/wox
          cp dist/Wox AppDir/usr/bin/Wox
          cp packaging/licenses/type2-runtime.txt AppDir/usr/share/doc/wox/type2-runtime-license.txt
          cp packaging/wox.desktop AppDir/wox.desktop
          cp packaging/wox.desktop AppDir/usr/share/applications/wox.desktop
          cp packaging/wox.svg AppDir/usr/share/icons/hicolor/scalable/apps/wox.svg
          cp packaging/wox.svg AppDir/wox.svg
          cp packaging/wox.svg AppDir/.DirIcon
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Wox" "$@"
          EOF
          chmod +x AppDir/AppRun
      - name: AppImage oluştur
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          curl -L --fail --retry 3 -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          curl -L --fail --retry 3 -o runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46  runtime-x86_64" | sha256sum --check
          chmod +x runtime-x86_64
          ARCH=x86_64 ./appimagetool.AppImage --runtime-file runtime-x86_64 AppDir dist/Wox-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Wox-Linux-AppImage
          path: dist/Wox-x86_64.AppImage

      - name: FUSE gerektirmeyen Linux paketi
        shell: bash
        run: |
          mkdir -p Portable
          cp dist/Wox Portable/Wox
          cp dist/Wox-x86_64.AppImage Portable/Wox-x86_64.AppImage
          cp packaging/licenses/type2-runtime.txt Portable/type2-runtime-license.txt
          chmod +x Portable/Wox
          chmod +x Portable/Wox-x86_64.AppImage
          cat > Portable/README.txt <<'EOF'
          Wox Linux taşınabilir paketi

          Arşivi dosya yöneticisinde çıkarın. Wox-x86_64.AppImage dosyasına
          çift tıklayın. Çalıştırma izni sorulursa "Çalıştır"ı seçin.
          FUSE uyumsuzsa aynı klasördeki Wox dosyasını açın; bu seçenek FUSE
          gerektirmez.
          EOF
          tar -czf dist/Wox-Linux-x86_64.tar.gz -C Portable Wox Wox-x86_64.AppImage README.txt type2-runtime-license.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Wox-Linux-portable
          path: dist/Wox-Linux-x86_64.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Wox-Windows-exe
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: Wox-Linux-AppImage
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: Wox-Linux-portable
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          name: Wox ${{ github.ref_name }}
          body: |
            Wox özel motor prototipi için Windows ve Linux masaüstü paketleri.

            Bu sürüm `/dev/kvm` vCPU smoke testi, SeaBIOS firmware gölgelemesi, E820 belleği ve salt okunur ISO9660/ATAPI CD-ROM aygıtını içerir. Linux'ta depodaki test ISO'su BIOS'tan ATAPI aşamasına ulaşır; gerçek masaüstü konuğu ve kalan aygıt desteği henüz tamamlanmamıştır.
            Tam işletim sistemi ISO önyüklemesi bu sürümde çalışan bir konuk sistemi olarak sunulmaz.
            Demo Keon sekmesi ve DemoPHO konuşması görsel/çevrimdışı prototiptir; çalışan bir Linux konuk sistemi değildir.
            AppImage statik FUSE3 runtime kullanır; libfuse2 gerektirmez. İndirme çalıştırma iznini korumazsa Wox-Linux-x86_64.tar.gz arşivini çıkarın. Arşiv hem AppImage'ı hem de FUSE'suz Wox uygulamasını içerir.
          files: |
            release-assets/Wox.exe
            release-assets/Wox-x86_64.AppImage
            release-assets/Wox-Linux-x86_64.tar.gz
          fail_on_unmatched_files: true
          make_latest: true
